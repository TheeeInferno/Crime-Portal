<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Major Crimes CAD Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="top-bar">
   <div class="system-title">MAJOR CRIMES TASK FORCE — INTEGRATED CAD / RMS</div>
   <div class="top-right">
    <button class="logout-button" onclick="logout()">LOGOUT</button>
   </div>
 </div>

  <!-- LEFT MENU -->
  <div class="side-menu">
    <ul>
     <li><a href="#" onclick="showDashboard()">Dashboard</a></li>
     <li><a href="#" onclick="showReports()">Reports</a></li>
     <li><a href="#" onclick="showMap()">Map</a></li>
     <li><a href="#" onclick="showCases()">Cases</a></li>
     <li><a href="#" onclick="showBOLOs()">BOLOs</a></li>
    </ul>
  </div>

  <!-- DASHBOARD CONTENT -->
<div class="dashboard-main">
  <div id="content-area" class="dashboard-container">

    <div class="dashboard-panel">
      <h2>Active Cases</h2>
      <p>No cases loaded</p>
    </div>

    <div class="dashboard-panel">
      <h2>Active BOLOs</h2>
      <p>No alerts</p>
    </div>

    <div class="dashboard-panel">
      <h2>Recent Activity</h2>
      <p>Nothing to display</p>
    </div>

  </div>
</div>


  <!-- BOTTOM BAR -->
  <div class="footer">
    SYSTEM STATUS: <span class="online">ONLINE</span><br>
    Authorized law enforcement use only. All activity is monitored and logged.
  </div>

  <script src="dashboard.js"></script>

</body>

</html>
